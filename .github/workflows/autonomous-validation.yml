name: Autonomous Website Validation

concurrency:
  group: autonomous-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'aeos/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-certification:
    name: Playwright + axe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser certification
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  lighthouse:
    name: Lighthouse quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lighthouse CI
        run: npm install --no-save --no-audit --no-fund @lhci/cli@0.15.1

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mcd-http.log 2>&1 &
          sleep 2

      - name: Run Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-evidence-${{ github.sha }}
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
