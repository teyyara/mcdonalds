    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;justify-content:flex-end}.drawer{height:100%;width:min(450px,100%);background:#fff;overflow:auto;padding:22px}.dialog-wrap{align-items:center;justify-content:center;padding:20px}.dialog{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:24px}.close{width:40px;height:40px;border-radius:50%;background:#f4f4f4;cursor:pointer;font-size:24px}.dialog-body{padding:24px}.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:24px}.detail-img{background:var(--cream);border-radius:18px;min-height:360px}.detail-img img{width:100%;height:100%;object-fit:contain;padding:20px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;background:#f1f1f1;cursor:pointer;font-weight:900}.qty strong{min-width:24px;text-align:center}

</head>

    var p=products.find(function(x){return x.id===id});if(!p)return;
    var qty=1;
    openOverlay('<div class="overlay dialog-wrap"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="productTitle"><div class="dialog-head"><h2 id="productTitle">'+esc(p.name)+'</h2><button class="close" data-act="close" aria-label="Close">×</button></div><div class="dialog-body"><div class="product-detail"><div class="detail-img">'+img(p.image,p.name)+'</div><div><div class="tag">'+esc(p.category)+'</div><p>'+esc(p.desc)+'</p><div style="font-size:28px;font-weight:950;margin:20px 0">'+money(p.price)+'</div><div class="qty"><button data-act="modal-qty" data-d="-1" aria-label="Decrease quantity">−</button><strong id="dialogQty">1</strong><button data-act="modal-qty" data-d="1" aria-label="Increase quantity">+</button></div><button class="pill yellow" style="margin-top:20px;width:100%" id="dialogAdd" data-act="modal-add" data-id="'+p.id+'">Add to order</button><p class="note" style="margin-top:12px">Sample product and price for this demo.</p></div></div></div></div></div>','product');
    var add=document.getElementById('dialogAdd');
    document.querySelectorAll('[data-act="modal-qty"]').forEach(function(btn){btn.addEventListener('click',function(){qty=Math.max(1,qty+Number(btn.dataset.d));document.getElementById('dialogQty').textContent=qty;add.dataset.qty=qty})});
  }

  function cartDrawer(){
    var items=cartItems();
    var body=items.length?items.map(function(i){return '<article class="cart-item"><img src="'+esc(i.image)+'" alt="'+esc(i.name)+'"><div><h3>'+esc(i.name)+'</h3><small>'+money(i.price)+' each</small><div class="qty" style="margin-top:6px"><button data-act="cart-qty" data-id="'+i.id+'" data-d="-1">−</button><strong>'+i.qty+'</strong><button data-act="cart-qty" data-id="'+i.id+'" data-d="1">+</button></div></div><strong>'+money(i.qty*i.price)+'</strong></article>'}).join(''):'<div class="empty" style="margin-top:10px">Your demo bag is empty.</div>';
    openOverlay('<div class="overlay"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle"><div class="dialog-head" style="padding:0 0 18px"><h2 id="cartTitle">Your order</h2><button class="close" data-act="close">×</button></div>'+body+(items.length?'<div class="summary"><div class="row"><span>Subtotal</span><strong>'+money(subtotal())+'</strong></div><div class="row"><span>Demo tax</span><strong>'+money(tax())+'</strong></div><div class="row total"><span>Total</span><strong>'+money(total())+'</strong></div><button class="pill red" style="width:100%;margin-top:10px" data-act="checkout">Continue to demo checkout</button><button class="pill light" style="width:100%;margin-top:8px" data-act="clear-cart">Clear bag</button></div>':'')+'</aside></div>','cart');
  }

  function searchPanel(){
    openOverlay('<div class="search-panel"><div class="search-inner"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="kicker">Search</div><h2>What are you looking for?</h2></div><button class="close" data-act="close">×</button></div><input class="global-search" id="globalSearch" placeholder="Try “Big Mac”, “dessert” or “rewards”" autocomplete="off"><div class="search-results" id="searchResults"></div></div></div>','search');
    var input=document.getElementById('globalSearch');input.focus();input.addEventListener('input',function(){searchResults(input.value)});
    searchResults('');
  }

  function searchResults(q){
    var root=document.getElementById('searchResults');if(!root)return;
    var needle=q.trim().toLowerCase();if(!needle){root.innerHTML='<p class="note">Start typing to search products and sections.</p>';return}
    var prods=products.filter(function(p){return (p.name+' '+p.category+' '+p.desc).toLowerCase().indexOf(needle)>=0}).slice(0,6);
    var links=[['Our Menu','#menu'],['Deals','#deals'],['Rewards','#rewards'],['Restaurant Locator','#locator'],['About Our Food','#about']].filter(function(x){return x[0].toLowerCase().indexOf(needle)>=0});
    root.innerHTML=(links.map(function(x){return '<a class="pill light" href="'+x[1]+'" data-act="close">'+esc(x[0])+'</a>'}).join(''))+(prods.map(function(p){return '<button class="pill light" data-act="product" data-id="'+p.id+'">'+esc(p.name)+'</button>'}).join(''))+(!links.length&&!prods.length?'<div class="empty">No results found.</div>':'');
  }

  function checkout(){
    var selected=stores.find(function(s){return s.id===state.selectedStore})||stores[0];
    var items=cartItems();
    if(!items.length){toast('Add an item before starting checkout.');return}
    openOverlay('<div class="overlay dialog-wrap"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle"><div class="dialog-head"><h2 id="checkoutTitle">Demo checkout</h2><button class="close" data-act="close">×</button></div><div class="dialog-body"><div class="order-tabs"><button class="order-tab '+(state.orderType==='pickup'?'active':'')+'" data-act="order-type" data-type="pickup">Pickup</button><button class="order-tab '+(state.orderType==='delivery'?'active':'')+'" data-act="order-type" data-type="delivery">Delivery-style</button></div><form class="form" id="checkoutForm"><div class="field"><label for="restaurant">Restaurant</label><select id="restaurant" required>'+stores.map(function(s){return '<option value="'+s.id+'" '+(s.id===selected.id?'selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></div><div class="field"><label for="customer">Name</label><input id="customer" required></div><div class="field"><label for="email2">Email</label><input id="email2" type="email" required></div><div class="field"><label for="note2">Order note</label><textarea id="note2" placeholder="Optional"></textarea></div><div class="summary"><div class="row"><span>Demo total</span><strong>'+money(total())+'</strong></div></div><button class="pill red" type="submit">Place demo order</button></form></div></div></div></div>','checkout');
    var form=document.getElementById('checkoutForm');if(form)form.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(form);var s=stores.find(function(x){return x.id===fd.get('restaurant')})||selected;var order='DEMO-'+String(Date.now()).slice(-6);state.cart={};save();closeOverlay();render();openOverlay('<div class="overlay dialog-wrap"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="doneTitle"><div class="dialog-head"><h2 id="doneTitle">Order confirmed</h2><button class="close" data-act="close">×</button></div><div class="dialog-body" style="text-align:center;padding:46px 24px"><div style="font-size:76px">🍟</div><h3 style="font-size:34px;line-height:1;margin:10px 0">Demo order placed.</h3><p class="sub">Order '+order+' was stored locally on this device. No payment or real McDonald’s order was created.</p><div class="banner" style="text-align:left;margin-top:22px"><div class="row"><span>Restaurant</span><strong>'+esc(s.name)+'</strong></div><div class="row" style="margin-top:9px"><span>Type</span><strong>'+esc(state.orderType)+'</strong></div></div><button class="pill yellow" style="margin-top:18px;width:100%" data-act="close">Done</button></div></div></div></div>','done');render()});
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act],a[href^="#"]');if(!el)return;
    var act=el.dataset.act;
    if(!act && el.tagName==='A'){state.mobile=false;return}
    if(act==='hero-next'){state.hero=(state.hero+1)%heroes.length;render();return}
    if(act==='hero-prev'){state.hero=(state.hero-1+heroes.length)%heroes.length;render();return}
    if(act==='hero-dot'){state.hero=Number(el.dataset.i);render();return}
    if(act==='product'){productDialog(el.dataset.id);return}
    if(act==='add'){var p=products.find(function(x){return x.id===el.dataset.id});if(!p)return;var existing=state.cart[p.id];state.cart[p.id]={id:p.id,name:p.name,price:p.price,image:p.image,qty:(existing?existing.qty:0)+1};state.points+=5;save();toast(p.name+' added to your order.');render();return}
    if(act==='modal-add'){var p2=products.find(function(x){return x.id===el.dataset.id});var q=Number(el.dataset.qty||1);var ex=state.cart[p2.id];state.cart[p2.id]={id:p2.id,name:p2.name,price:p2.price,image:p2.image,qty:(ex?ex.qty:0)+q};state.points+=q*5;save();closeOverlay();render();toast(p2.name+' added to your order.');return}
    if(act==='modal-qty')return
    if(act==='cart-qty'){var ci=state.cart[el.dataset.id];if(!ci)return;ci.qty+=Number(el.dataset.d);if(ci.qty<=0)delete state.cart[el.dataset.id];save();render();cartDrawer();return}
    if(act==='clear-cart'){state.cart={};save();render();cartDrawer();toast('Demo bag cleared.');return}
    if(act==='checkout'){checkout();return}
    if(act==='order-type'){state.orderType=el.dataset.type;checkout();return}
    if(act==='cat'){state.cat=el.dataset.cat;state.query='';location.hash='#menu?cat='+encodeURIComponent(state.cat);return}
    if(act==='clear-search'){state.query='';location.hash='#menu';return}
    if(act==='clear-store-search'){location.hash='#locator';return}
    if(act==='select-store'){state.selectedStore=el.dataset.id;save();toast('Sample restaurant highlighted.');return}
    if(act==='choose-store'){state.selectedStore=el.dataset.id;save();toast('Sample restaurant selected.');render();return}
    if(act==='earn'){state.points+=100;save();render();toast('100 demo points added.');return}
    if(act==='reset-points'){state.points=0;save();render();toast('Demo points reset.');return}
    if(act==='redeem'){var rp=products.find(function(x){return x.id===el.dataset.id});if(state.points<200){toast('You need 200 demo points to redeem.');return}state.points-=200;var rex=state.cart[rp.id];state.cart[rp.id]={id:rp.id,name:rp.name,price:0,image:rp.image,qty:(rex?rex.qty:0)+1};save();render();toast(rp.name+' added as a 200-point demo reward.');return}
    if(act==='search'){searchPanel();return}
    if(act==='close'){closeOverlay();return}
  });

  document.getElementById('hamb').addEventListener('click',function(){state.mobile=!state.mobile;render()});
  document.getElementById('searchBtn').addEventListener('click',searchPanel);
  document.getElementById('cartBtn').addEventListener('click',cartDrawer);
  window.addEventListener('hashchange',render);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.overlay)closeOverlay()});
  setInterval(function(){if(state.route.path==='home'&&!state.overlay&&!state.mobile&&document.visibilityState==='visible'){state.hero=(state.hero+1)%heroes.length;document.querySelectorAll('.hero-slide').forEach(function(s,i){s.classList.toggle('active',i===state.hero);s.setAttribute('aria-hidden',i===state.hero?'false':'true')});document.querySelectorAll('.hero-controls .dot').forEach(function(d,i){d.classList.toggle('active',i===state.hero)})}},8000);
  render();
})();
</script>
</body>
</html>
